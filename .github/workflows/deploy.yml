# Builds the static site (next.config.ts: output "export") and force-pushes the out/ folder to
# the deploy branch. Point GitHub Pages at that branch: Settings → Pages → "Deploy from a branch"
# → gh-pages, folder "/ (root)".
name: Deploy static site

on:
  push:
    branches: [main]
  # Daily rebuild so the GitHub stats on the page (repos, followers, languages) stay current.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write # push the deploy branch

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  DEPLOY_BRANCH: gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check and lint
        run: |
          npx next typegen
          npx tsc --noEmit
          npm run lint

      # Project sites live under /<repo>/ (e.g. /personal-wesite3.0/); a <user>.github.io repo lives at /.
      - name: Compute base path
        id: base
        run: |
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == *.github.io ]]; then path=""; else path="/$repo"; fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "Base path: '${path:-/}'"

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}
          # Used server-side at build time only, to avoid GitHub API rate limits on shared runners.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push out/ to ${{ env.DEPLOY_BRANCH }}
        working-directory: out
        run: |
          # Keep Pages from running Jekyll, which would drop the _next/ folder.
          touch .nojekyll
          git init -q -b "$DEPLOY_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          # Orphan branch with a single commit: the deploy branch only ever holds the latest build.
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:$DEPLOY_BRANCH"
          echo "Deployed ${GITHUB_SHA::7} to $DEPLOY_BRANCH"
